<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규제 상세 | EU ESG 규제 모니터링</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html">
      <div class="mark" aria-hidden="true"></div>
      <div class="bname">K-Mobility 브릿지 재단</div>
    </a>
    <div class="navlinks">
      <a href="index.html#cal" class="hide-m">시행 캘린더</a>
      <a href="index.html#regs" class="hide-m act">규제 현황</a>
      <a href="weekly.html" id="navNews">주간 동향</a>
    </div>
  </div>
</nav>

<div class="dhead" id="dhead">
  <div class="wrap">
    <div class="crumb"><a href="index.html">대시보드</a><span>›</span><a href="index.html#regs">규제 현황</a><span>›</span><span id="crumbAbbr"></span></div>
    <div class="d-r1" id="dR1"></div>
    <p class="d-name" id="dName"></p>
  </div>
</div>

<div class="wrap">
  <div class="dgrid">
    <div>
      <div id="detailBlocks"></div>
      <div class="shead"><h2>관련 동향 전체</h2><span class="n" id="poolNote"></span></div>
      <div class="nlist" id="poolList"></div>
    </div>
    <aside class="side">
      <div class="panel">
        <h3>개요</h3>
        <p class="ptext" id="dDesc"></p>
      </div>
      <div class="panel" id="apPanel" hidden>
        <h3>우리 회사 기준 적용 수준</h3>
        <div id="apBody"></div>
      </div>
      <div class="panel" id="fbPanel" hidden>
        <h3>재단 브리핑 · 권고</h3>
        <div id="fbBody"></div>
      </div>
      <div class="panel" id="oemPanel" hidden>
        <h3>완성차 고객사 동향</h3>
        <p class="ptext" id="oemBody"></p>
      </div>
      <div class="panel">
        <h3>공식 문서 · 가이던스</h3>
        <div class="doclist" id="docList"></div>
      </div>
      <div class="panel">
        <h3>다른 규제 바로가기</h3>
        <div class="reglist" id="otherRegs"></div>
      </div>
    </aside>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="fl">수집 출처</div>
    <ul id="srcList"></ul>
    <div class="fn">
      K-Mobility 브릿지 재단 · ESG 규제 대응 &nbsp;|&nbsp;
      규제 시행 일정은 2026년 7월 기준이며 EU Omnibus 협상 결과에 따라 변동될 수 있습니다.
    </div>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  const E = window.ESG;
  const { REGS, esc, fmtDate, colorOf, LV } = E;
  E.navInit();

  const id = new URLSearchParams(location.search).get("id");
  const r = REGS.find(x => x.id === id);
  if (!r) { location.replace("index.html#regs"); return; }

  document.title = r.abbr + " — " + r.name + " | EU ESG 규제 모니터링";
  const col = colorOf(r);
  document.getElementById("dhead").style.cssText = "--rcc:" + col.c + ";--rcw:" + col.w;

  document.getElementById("crumbAbbr").textContent = r.abbr;
  document.getElementById("dR1").innerHTML =
    '<div class="d-abbr">' + esc(r.abbr) + "</div>" +
    '<span class="d-status">' + esc(r.status) + "</span>" +
    (r.dday !== null && r.dday > 0 ? '<span class="d-status">D-' + r.dday + " · " + esc(r.keyLabel) + "</span>" : "") +
    (r.alertN ? '<span class="alertpill">확인 필요 ' + r.alertN + "건</span>" : "");
  document.getElementById("dName").textContent = r.name;
  document.getElementById("dDesc").textContent = r.desc;

  /* 규제 상세: 적용 대상·기준 / 시행 일정 / 벌칙·제재 */
  const D = E.REG_DETAILS[r.id];
  if (D) {
    const rows = a => a.map(([k, v]) =>
      "<tr><th>" + esc(k) + "</th><td>" + esc(v) + "</td></tr>").join("");
    document.getElementById("detailBlocks").innerHTML =
      '<div class="shead"><h2>적용 대상 · 기준</h2></div>' +
      '<table class="dtable">' + rows(D.scope) + "</table>" +
      (D.note ? '<p class="dnote">※ ' + esc(D.note) + "</p>" : "") +
      '<div class="shead" style="margin-top:32px"><h2>시행 일정</h2></div>' +
      '<table class="dtable">' + rows(D.phases) + "</table>" +
      '<div class="shead" style="margin-top:32px"><h2>벌칙 · 제재</h2></div>' +
      '<p class="pbox">' + esc(D.penalty) + "</p>" +
      '<div style="height:32px"></div>';
  }

  /* 공식 문서·가이던스 링크 */
  const docs = [{ t: r.linkLabel + " (원문)", u: r.link }].concat(D && D.guidance ? D.guidance : []);
  document.getElementById("docList").innerHTML = docs.map(d =>
    '<a href="' + esc(d.u) + '" target="_blank" rel="noopener">' + esc(d.t) + " ↗</a>").join("");

  /* 우리 회사 기준 적용 수준 (대시보드에서 선택한 프로필 사용) */
  const apBody = document.getElementById("apBody");
  const apPanel = document.getElementById("apPanel");
  apPanel.hidden = false;
  if (E.isSet()) {
    E.assess();
    const lv = LV[r.ap.lv];
    apBody.innerHTML =
      '<span class="lv" style="--lvc:' + lv.c + ";--lvw:" + lv.w + '">' + lv.t + "</span>" +
      '<div class="why" style="--lvc:' + lv.c + '"><b>' + lv.t + "</b> · " + esc(r.ap.why) + "</div>";
  } else {
    apBody.innerHTML =
      '<p class="ptext">대시보드의 <a class="plink" href="index.html#profile">우리 회사 기준으로 보기</a>에서 ' +
      "규모·거래 형태를 선택하면 이 규제의 적용 수준이 여기에 표시됩니다.</p>";
  }

  /* 재단 브리핑·권고 — 이 규제 태그가 달린 코멘트 (최신 3건) */
  const CB = { "주의": "cb-warn", "권고": "cb-rec", "참고": "cb-info" };
  const fbPoints = [];
  (E.data.comments || []).forEach(c => (c.points || []).forEach(p => {
    if (p.tag === r.tag) fbPoints.push({ ...p, date: c.date });
  }));
  if (fbPoints.length) {
    document.getElementById("fbPanel").hidden = false;
    document.getElementById("fbBody").innerHTML = fbPoints.slice(0, 3).map(p =>
      '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
      (p.type ? '<span class="cb ' + (CB[p.type] || "cb-info") + '">' + esc(p.type) + "</span> " : "") +
      '<span style="font-size:.8rem;color:var(--ink-3)">' + esc(p.date) + "</span>" +
      '<div style="font-weight:700;font-size:.94rem;margin-top:3px">' + esc(p.title) + "</div>" +
      '<div class="ptext" style="margin-top:2px">' + esc(p.body) + "</div></div>").join("");
  }

  /* 완성차 고객사 동향 */
  const oem = E.OEM_NOTES[r.id];
  if (oem) {
    document.getElementById("oemPanel").hidden = false;
    document.getElementById("oemBody").textContent = oem;
  }

  /* 관련 동향 전체 */
  document.getElementById("poolNote").textContent =
    "총 " + r.pool.length + "건" +
    (r.alertN ? " · 확인 필요 " + r.alertN + "건이 맨 위에 표시됩니다" : "");
  document.getElementById("poolList").innerHTML = r.pool.length
    ? r.pool.map(x =>
        '<a class="nrow" href="' + esc(x.link) + '" target="_blank" rel="noopener">' +
        '<div class="t">' +
        (x.alert ? '<span class="isalert">확인 · ' + esc(x.alert) + "</span>" : "") +
        esc(x.title) + "</div>" +
        '<div class="m">' + fmtDate(x.date) + (x.src ? " · " + esc(x.src) : "") + "</div></a>").join("")
    : '<div class="empty">최근 수집된 관련 기사가 없습니다.</div>';

  /* 다른 규제 바로가기 */
  document.getElementById("otherRegs").innerHTML = REGS.filter(x => x.id !== r.id).map(x =>
    '<a href="reg.html?id=' + x.id + '">' + esc(x.abbr) +
    " <small>" + esc(x.name) + "</small>" +
    (x.alertN ? '<span class="alertpill">확인 ' + x.alertN + "</span>" : "") + "</a>").join("");
})();
</script>
</body>
</html>
